name: Bug report
description: Something in the game behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the bug lets a player see information they should not have, do not file it here. Use [private vulnerability reporting](https://github.com/vroslmend/check-the-card-game-v2/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the game did in response.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If it is a rules question, GAME_RULES.md is the specification.
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players in the game
      placeholder: "3"
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser, device and window size
      placeholder: "Chrome on a Pixel 5, portrait"
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Game code if you still have it, screenshots, a recording, console errors.
    validations:
      required: false
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: If you can, end with a command that shows whether this is still happening, what it returns today, and the date you checked. A grep beats a line number, because line numbers rot and commands do not. Leave it blank if you are reporting from play rather than from the code, and it will be filled in during triage.
      placeholder: |
        Open as of YYYY-MM-DD. `grep -n "some distinctive string" path/to/file.ts` returns a hit while this is live. Empty output means the code changed and this may already be fixed.
    validations:
      required: false
