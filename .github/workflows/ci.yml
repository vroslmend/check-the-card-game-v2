name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No paths-ignore. This is a required check, and a path-filtered skip leaves it
# pending forever, blocking the pull request with no obvious cause.
jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # verify checks the commit messages a branch adds, which needs the
          # base branch present to compare against. A shallow checkout has none.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Match the version Vercel builds with, so this tests what ships.
          node-version: 22
          cache: npm

      # Before install, so a surprise major fails in seconds.
      - name: Check dependency majors
        run: npm run check:majors

      - name: Install
        run: npm ci

      # One command, so this and what contributors are told to run cannot
      # drift apart. Add a check to the verify script, not to this file.
      - name: Verify
        run: npm run verify

      # Typechecking proves the server compiles, not that it runs. This catches
      # a throw on startup or a broken module-alias mapping.
      - name: Server starts and answers /health
        run: |
          node server/dist/index.js &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "server answered /health"
              kill $pid
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not answer /health within 15s"
          cat <<'EOF'
          The server built but never became reachable. Run it locally with
          npm run build:server-deps && node server/dist/index.js
          EOF
          kill $pid 2>/dev/null || true
          exit 1

  # Not a required check: a real browser is slower and flakier than the build,
  # and it should report a layout or reachability problem, not block a merge.
  probe:
    name: Browser probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/probe/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/probe
          cd tools/probe && npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:server-deps && npm run build:client

      # The peek and matching waits go short so a scripted round does not sit
      # through them. The turn timer goes long, because it is the one that fires
      # unasked and would move the board while the probe measures it. Each probe
      # run creates a game, which the default rate limit would refuse by the
      # fourth.
      - name: Start the server and the client
        run: |
          PEEK_DURATION_MS=200 MATCHING_STAGE_DURATION_MS=400 TURN_TIMER_MS=600000 \
            CREATE_GAME_RATE_LIMIT=100 node server/dist/index.js > server.log 2>&1 &
          npm start -w client > client.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null &&
              curl -fsS http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the server or the client did not come up within 60s"
          tail -20 server.log client.log
          exit 1

      # Every stage at every device size in tools/probe/viewports.mjs, one in the
      # light theme, and one watching for seats that move sideways when only the
      # phase changes. The full --matrix sweep also tries heights below any
      # device and takes minutes, so it stays a local tool.
      - name: Probe each stage
        run: |
          failed=0
          run=0
          for spec in "lobby 6" "play 6 --shift" "play 2 --theme light" \
            "drawn 2" "matching 4" "scoring 6"; do
            set -- $spec
            run=$((run + 1))
            echo "::group::$spec"
            npm run probe -- --at "$1" --players "$2" "${@:3}" \
              --out ".probe/$run-$1-$2" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe
          path: .probe/
          # The directory starts with a dot, which the action skips by default.
          include-hidden-files: true
          retention-days: 14
