name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No paths-ignore. This is a required check, and a path-filtered skip leaves it
# pending forever, blocking the pull request with no obvious cause.
jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Match the version Vercel builds with, so this tests what ships.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared types
        run: npm run build:shared

      - name: Typecheck shared types
        run: npx tsc --noEmit -p shared-types/tsconfig.json

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Typecheck client
        run: npx tsc --noEmit -p client/tsconfig.json

      # Its own step: the client build runs with --no-lint.
      - name: Lint client
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build server
        run: npm run build:server

      # Typechecking proves the server compiles, not that it runs. This catches
      # a throw on startup or a broken module-alias mapping.
      - name: Server starts and answers /health
        run: |
          node server/dist/index.js &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "server answered /health"
              kill $pid
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not answer /health within 15s"
          cat <<'EOF'
          The server built but never became reachable. Run it locally with
          npm run build:server-deps && node server/dist/index.js
          EOF
          kill $pid 2>/dev/null || true
          exit 1

      - name: Build client
        run: npm run build:client
